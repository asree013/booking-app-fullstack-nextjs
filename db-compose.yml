version: '3.8'

services:

  mysql_fullstack:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # ไม่ expose port 3306 ออก public (ปลอดภัยกว่า ใช้ network internal แทน)
    expose:
      - "3306"
    env_file:
      - .env
    volumes:
      - mysql_data_1:/var/lib/mysql
    networks:
      - next_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app_next:
    image: asree001/booking-app-next:latest
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      DATABASE_URL: mysql://${MYSQL_USERNAME}:${MYSQL_PASSWORD}@mysql_fullstack:3306/${MYSQL_DATABASE}
      BASE_URL: "http://localhost:3000"
      NODE_ENV: production
    env_file:
      - .env
    depends_on:
      mysql_fullstack:
        condition: service_healthy
    networks:
      - next_network
    volumes:
      - uploads_data:/app/uploads
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app_next
    networks:
      - next_network
    restart: unless-stopped

volumes:
  mysql_data_1:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  next_network:
    driver: bridge