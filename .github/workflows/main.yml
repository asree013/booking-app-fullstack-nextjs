name: Deploy Next.js to Server

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      REGISTRY: docker.io
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_API: booking-app-next

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: package-version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Extracted version: $VERSION"

      - name: Validate version
        run: |
          if [ -z "${{ steps.package-version.outputs.VERSION }}" ] || [ "${{ steps.package-version.outputs.VERSION }}" = "null" ]; then
            echo "❌ Failed to extract version from package.json"
            exit 1
          fi
          echo "✅ Version validation passed: ${{ steps.package-version.outputs.VERSION }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.package-version.outputs.VERSION }}
          # Enable caching
          cache-from: |
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:build-cache
          cache-to: |
            type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:build-cache,mode=max

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Image
        run: |
          docker compose -f ./app.yml build app_next && docker compose -f ./app.yml push app_next

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd server

            docker compose -f app.yml pull app_next
            docker compose -f app.yml down app_next
            docker compose -f app.yml up -d app_next --build --no-cache

            # 4. ลบไฟล์ขยะ
            docker image prune -f

            # 5. ตรวจสอบสถานะ (จะไปโผล่ในหน้า GitHub Actions ให้เราดู)
            docker ps | grep app_next
