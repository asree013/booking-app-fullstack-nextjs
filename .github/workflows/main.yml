name: Deploy Next.js to Server (Docker)

on:
  push:
    branches: [ main ] 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # อัปเดตเป็น v4 ใหม่ล่าสุด

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. เข้าไปยังโฟลเดอร์โปรเจกต์ใน Server (แก้ Path ให้ตรงกับเครื่องคุณ)
            cd /path/to/your/project

            # 2. ดึงโค้ดล่าสุดลงมา
            git pull origin main

            # 3. สั่ง Docker Build และรันใหม่ (ใช้ Dockerfile และ Compose ที่คุณมี)
            # --build จะสั่งให้มันสร้าง Image ใหม่ตามโค้ดที่เพิ่ง pull มา
            docker compose up -d --build

            # 4. ลบ Image เก่าๆ ที่ไม่ได้ใช้ทิ้งเพื่อประหยัดที่ใน Server (Optional)
            docker image prune -f
