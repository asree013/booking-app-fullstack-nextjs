name: Deploy Next.js to Server

on:
  push:
    branches: [ main ] 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. เข้าโฟลเดอร์โปรเจกต์ใน Server
            cd /root/booking-app-fullstack-nextjs 

            # 2. อัปเดตโค้ดจาก GitHub มาไว้ที่ Server
            git fetch --all
            git reset --hard origin/main

            # 3. สั่ง Build โดยระบุชื่อไฟล์เป็น app.yml และเจาะจง service app_next
            # ใช้ --no-cache เพื่อบังคับให้สร้างใหม่ 100% ไม่ใช้ของเก่า
            docker compose -f app.yml up -d app_next --build --no-cache

            # 4. ลบไฟล์ขยะ
            docker image prune -f

            # 5. ตรวจสอบสถานะ (จะไปโผล่ในหน้า GitHub Actions ให้เราดู)
            docker ps | grep app_next
