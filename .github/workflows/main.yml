name: Deploy Next.js to Server

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      # รวมชื่อ Repo ไว้ที่เดียวเพื่อลดความผิดพลาดเรื่องเครื่องหมาย /
      DOCKERHUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/booking-app-next

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: package-version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Extracted version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          # ใช้ | เพื่อให้เขียนหลายบรรทัดได้สะอาดที่สุด
          tags: |
            ${{ env.DOCKERHUB_REPO }}:latest
            ${{ env.DOCKERHUB_REPO }}:${{ steps.package-version.outputs.VERSION }}
          # จัดการ Cache ในรูปแบบที่ Formatter จะไม่ทำพัง
          cache-from: type=registry,ref=${{ env.DOCKERHUB_REPO }}:build-cache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_REPO }}:build-cache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push # ต้องรอให้ Job บน Build เสร็จก่อนถึงจะเริ่ม Deploy
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. เข้าไปในโฟลเดอร์ที่มีไฟล์ app.yml
            cd /root/booking-app-fullstack-nextjs/server

            # 2. Login Docker Hub บน Server เพื่อให้มีสิทธิ์ดึง Image
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # 3. ดึง Image ล่าสุดลงมา
            docker compose -f app.yml pull app_next

            # 4. สั่ง Recreate container เฉพาะตัว app_next
            # ไม่ต้องใช้ --build แล้วเพราะเราดึง Image สำเร็จรูปมาจาก Docker Hub
            docker compose -f app.yml up -d app_next

            # 5. ลบ Image เก่าที่ไม่ได้ใช้
            docker image prune -f

            # 6. ตรวจสอบสถานะ
            docker ps | grep app_next
