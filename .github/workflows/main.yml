name: Deploy Next.js to Server

on:
  push:
    branches: [ main ] 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. เข้าไปยังโฟลเดอร์โปรเจกต์ (ถ้ายังไม่มีให้ clone มาก่อน)
            if [ ! -d "~/booking-app" ]; then
              git clone https://github.com/asree013/booking-app-fullstack-nextjs.git ~/booking-app
            fi
            
            cd ~/booking-app
            
            # 2. ดึงโค้ดล่าสุด
            git pull origin main
            
            # 3. รัน Docker (จะ build ใหม่ตาม Dockerfile ที่คุณเขียนไว้)
            docker compose up -d --build
            
            # 4. ล้าง image เก่าๆ ที่ไม่ได้ใช้
            docker image prune -f
